syntax = "proto2";
package snakes.v2;
option java_package = "me.ippolitov.fit.snakes.v2";
option java_outer_classname = "SnakesProto";

// Роль узла в топологии связей узлов в пределах игры
enum NodeRole {
    NORMAL = 0; // Обычный узел, лист в топологии "звезда"
    MASTER = 1; // Главный узел, центр в топологии "звезда"
    DEPUTY = 2; // Заместитель главного узла
    reserved 3;
}

// Статус игрока, независимый от сетевой роли
enum PlayerStatus {
    PLAYING = 0; // Управляет одной змейкой
    VIEWING = 1; // Смотрит; может быть MASTER или DEPUTY
}

// Тип игрока
enum PlayerType {
    HUMAN = 0; // Живой пользователь
    ROBOT = 1; // Робот, управляет своей змеёй с помощью алгоритма (это не нужно реализовывать, но предусмотрено в протоколе на будущее)
}

// Игрок
message GamePlayer {
    required string name = 1;       // Имя игрока (для отображения в интерфейсе), непустое, до 24 байт UTF-8
    required int32 id = 2;          // Уникальный идентификатор игрока в пределах игры
    optional string ip_address = 3; // IPv4-адрес игрока в десятичной записи из четырёх октетов (до 15 ASCII-байт); IPv6 не поддерживается. Отсутствует в описании игрока-отправителя сообщения
    optional int32 port = 4;        // Порт UDP-сокета игрока. Отсутствует в описании игрока-отправителя сообщения
    required NodeRole role = 5;     // Роль узла в топологии
    optional PlayerType type = 6 [default = HUMAN]; // Тип игрока
    required int32 score = 7;       // Число очков 0..INT32_MAX; при прибавлении насыщается
    required PlayerStatus status = 8; // Управление змейкой или просмотр; не меняет сетевую роль
}

/* Параметры идущей игры (не должны меняться в процессе игры).
 * Диапазоны проверяет приложение, а не protobuf. */
message GameConfig {
    optional int32 width = 1 [default = 40];           // Ширина поля в клетках (от 10 до 100)
    optional int32 height = 2 [default = 30];          // Высота поля в клетках (от 10 до 100)
    optional int32 food_static = 3 [default = 1];       // Минимальное количество клеток с едой, независимо от числа игроков (от 0 до 10)
    optional int32 state_delay_ms = 5 [default = 1000]; // Задержка между ходами (сменой состояний) в игре, в миллисекундах (от 100 до 3000)
}

/* Игроки конкретной игры */
message GamePlayers {
    repeated GamePlayer players = 1; // Список всех игроков, включая VIEWING (не более 6)
}

enum Direction {
    UP = 1;     // Вверх (в отрицательном направлении оси y)
    DOWN = 2;   // Вниз (в положительном направлении оси y)
    LEFT = 3;   // Влево (в отрицательном направлении оси x)
    RIGHT = 4;  // Вправо (в положительном направлении оси x)
}

/* Текущее состояние игрового поля */
message GameState {
    /* Координаты в пределах игрового поля, либо относительное смещение координат.
     * Левая верхняя клетка поля имеет координаты (x=0, y=0).
     * Направление смещения задаётся знаком чисел. */
    message Coord {
        optional sint32 x = 1 [default = 0]; // По горизонтальной оси, положительное направление - вправо
        optional sint32 y = 2 [default = 0]; // По вертикальной оси, положительное направление - вниз
    }
    // Змея длиной 2..32 клетки
    message Snake {
        required int32 player_id = 1; // ID подключённого игрока со статусом PLAYING
        /* Список "ключевых" точек змеи. Первая точка хранит координаты головы змеи.
         * Каждая следующая - смещение следующей "ключевой" точки относительно предыдущей,
         * в частности последняя точка хранит смещение хвоста змеи относительно предыдущей "ключевой" точки.
         * Смещения ненулевые и осевые, описывают путь тела, а не кратчайший путь по тору.
         * Нулевая компонента смещения не записывается. */
        repeated Coord points = 2;
        reserved 3;
        reserved "state";
        required Direction head_direction = 4; // Направление, в котором "повёрнута" голова змейки в текущий момент
    }
    required int32 state_order = 1;   // Неотрицательный порядковый номер состояния, уникален в пределах игры, монотонно возрастает
    repeated Snake snakes = 2;        // Список змей (не более 4)
    repeated Coord foods = 3;         // Список клеток с едой; естественная граница food_static + 4 (не более 14)
    required GamePlayers players = 4; // Актуальнейший список игроков
    required int32 next_player_id = 5; // Выше всех выданных ID; сохраняется при смене MASTER
}

message GameAnnouncement {
    required GamePlayers players = 1;            // Текущие игроки
    required GameConfig config = 2;              // Параметры игры
    optional bool can_join = 3 [default = true]; // Можно ли новому игроку присоединиться в статусе PLAYING (есть ли место и не исчерпаны лимиты)
    required string game_name = 4;               // Уникальное имя активной игры на данном сервере, например "my game"; непустое, до 32 байт UTF-8
    reserved 5;
}

// Общий формат любого UDP-сообщения
// Ровно одно сообщение на датаграмму; сериализованный размер не более 1200 байт
message GameMessage {
    // Ничего не меняем, просто говорим, что мы живы
    message PingMsg {
    }
    // Не-центральный игрок просит повернуть голову змеи
    message SteerMsg {
        required Direction direction = 1; // Куда повернуть на следующем шаге
    }
    // Подтверждение сообщения с таким же seq; вне кеша и окна дедупликации, не требует ACK
    message AckMsg {
    }
    // Центральный узел сообщает остальным игрокам состояние игры
    message StateMsg {
        required GameState state = 1; // Состояние игрового поля
    }
    // Уведомление об идущих играх, регулярно отправляется multicast-ом или в ответ на DiscoverMsg
    message AnnouncementMsg {
        repeated GameAnnouncement games = 1; // Идущие игры (у обычного MASTER одна, сервер может объявлять несколько)
    }
    // Запрос информации об идущих играх
    message DiscoverMsg {
    }
    // Новый игрок хочет присоединиться к идущей игре
    message JoinMsg {
        optional PlayerType player_type = 1 [default = HUMAN]; // Тип присоединяющегося игрока
        required string player_name = 3; // Имя игрока, непустое, до 24 байт UTF-8
        required string game_name = 4;   // Уникальное имя игры, непустое, до 32 байт UTF-8
        reserved 5;
        required PlayerStatus requested_status = 6; // PLAYING для игры, VIEWING для просмотра
    }
    // Ошибка операции (например отказ в присоединении к игре, т.к. нет места на поле)
    message ErrorMsg {
        required string error_message = 1; // Строковое сообщение, нужно отобразить его на экране, не блокируя работу программы; до 128 байт UTF-8
        required int64 request_seq = 2; // msg_seq отклонённого запроса, не номер ErrorMsg
    }
    /* Сообщение о смене сетевой роли (статус игрока не меняется):
     * 1. от заместителя другим игрокам о том, что пора начинать считать его главным (sender_role = MASTER)
     * 2. от главного узла назначаемому заместителю (receiver_role = DEPUTY)
     * 3. от осознанно выходящего главного узла заместителю (sender_role = NORMAL, receiver_role = MASTER)
     */
    message NodeRoleChangeMsg {
        optional NodeRole sender_role = 1;
        optional NodeRole receiver_role = 2;
        required int32 state_order = 3; // Номер состояния с этим изменением роли
    }
    // Только участник -> MASTER: запрос; результат — ACK/Error и авторитетный StateMsg
    message PlayerStatusChangeMsg {
        required PlayerStatus status = 1;
        reserved 2;
        reserved "state_order";
    }
    // Полный выход из игры, а не переход к просмотру
    message LeaveMsg {
    }
    required int64 msg_seq = 1;   // Порядковый номер сообщения, уникален для отправителя в пределах игры, монотонно возрастает; повторы сохраняют номер, AckMsg копирует номер исходного сообщения и не расходует счётчик
    optional int32 sender_id = 10;   // ID игрока-отправителя этого сообщения (обязательно для unicast зарегистрированных участников; исключения до регистрации описаны в задании)
    optional int32 receiver_id = 11; // ID игрока-получателя этого сообщения (обязательно для unicast зарегистрированных участников; исключения до регистрации описаны в задании)
    required uint32 protocol_version = 13; // Всегда 2; остальные версии игнорируются
    reserved 14;
    optional string game_name = 17; // Имя игры; обязательно кроме DiscoverMsg и AnnouncementMsg
    // Тип сообщения
    oneof Type {
        PingMsg ping = 2;
        SteerMsg steer = 3;
        AckMsg ack = 4;
        StateMsg state = 5;
        AnnouncementMsg announcement = 6;
        JoinMsg join = 7;
        ErrorMsg error = 8;
        NodeRoleChangeMsg node_role_change = 9;
        DiscoverMsg discover = 12;
        PlayerStatusChangeMsg player_status_change = 15;
        LeaveMsg leave = 16;
    }
}
